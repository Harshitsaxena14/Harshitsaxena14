name: Update LeetCode Dashboard

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate live LeetCode SVG
        env:
          LEETCODE_USERNAME: harshit_saxena14
          OUTPUT: generated/leetcode.svg
        run: node scripts/update-leetcode.cjs

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/leetcode.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh LeetCode dashboard [skip ci]"
          git push
